services:
  - type: web
    name: krishimitra
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true